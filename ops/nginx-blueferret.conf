server {
    if ($host = www.blueferret.com.ua) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = blueferret.com.ua) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name blueferret.com.ua www.blueferret.com.ua;

    root /var/www/blueferret;
    index index.html;
    client_max_body_size 8m;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # runtime.js injection into every HTML page. Visibility rescue is handled
    # once by CSS/bf.js; never scan every animation on a permanent 100ms loop.
    sub_filter '</body>' '<script src="/api/public/runtime.js" defer></script></body>';
    # reveal fix: framer-motion whileInView leaves content at opacity:0 under React 19
    # (source lost, can't rebuild) — force the SSR-hidden content visible server-side.
    sub_filter '</head>' '<style>main [style*="opacity:0"],main [style*="opacity: 0"],footer [style*="opacity:0"],footer [style*="opacity: 0"]{opacity:1 !important;transform:none !important}</style></head>';
    sub_filter_once on;

    location ^~ /admin {
        # Declaring sub_filter here overrides (not merges with) the server-level
        # rules, so runtime.js — meant only for the public site's live-refresh —
        # stops getting injected into the admin CMS. Without this, every save
        # bumped publishedAt, runtime.js (running inside the admin page by
        # mistake) polled it, saw the change ~1.5s later, and did a real
        # location.href reload of the whole admin app (looked like "page saves
        # then flashes/reloads").
        sub_filter '<!--bf-admin-no-injection-->' '<!--bf-admin-no-injection-->';
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Admin-Auth "1";
    }
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:4100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ^~ /uploads/ {
        alias /var/www/blueferret/uploads/;
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }

    location ^~ /avtoram/ {
        return 301 /kik/pro-kik/;
    }

    location ~* \.(?:html|json|webmanifest|xml|txt)$ {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
        try_files $uri =404;
    }
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }
    location ~* \.(?:css|js|png|jpg|jpeg|gif|webp|avif|ico|svg|woff2?|ttf|otf|mp4|webm)$ {
        add_header Cache-Control "public, max-age=86400" always;
        try_files $uri =404;
    }
    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }




}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
